syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/model_type.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

message ModelsListRequest {
  // Index of the first result. Default zero.
  optional int32 offset = 1;

  // Maximum number of results. Omitted means all; zero means count only;
  // negative is InvalidArgument.
  optional int32 limit = 2;

  // CEL over `this` (a Model, proto field names) and `now` (server time),
  // with cel-go's standard library plus its strings extension. Empty means all.
  optional string filter = 3;

  // Sort key. Empty means `id` ascending. Allowed: id, -id, metadata.name,
  // -metadata.name. Any other value is InvalidArgument.
  optional string order = 4;
}

message ModelsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated Model items = 3;
}

message ModelsGetRequest {
  // Model id (equals metadata.name).
  string id = 1;
}

message ModelsGetResponse {
  Model object = 1;
}

message ModelsCreateRequest {
  // id / metadata.name and spec.model.uri are required. status is ignored.
  Model object = 1;
}

message ModelsCreateResponse {
  Model object = 1;
}

message ModelsUpdateRequest {
  Model object = 1;
  // Supported paths: metadata.labels, metadata.annotations, spec.model,
  // spec.replicas, spec.base_refs, spec.runtime, spec.router, spec.main,
  // spec.main.image, spec.main.env, spec.main.requests, spec.main.limits,
  // spec.scaling, spec.placement and spec.rollout, each optionally prefixed
  // with "object.". A path replaces that field as a whole. A path below
  // metadata.labels, metadata.annotations, spec.model, spec.router,
  // spec.main.env, spec.main.requests, spec.main.limits, spec.scaling,
  // spec.placement or spec.rollout (for example metadata.labels.<key>) is
  // accepted and replaces that whole field, not just the key. Any other path
  // is InvalidArgument, and so is an empty mask. spec.replicas and
  // spec.scaling are exclusive: setting one clears the other. The merged
  // model is validated as on Create.
  google.protobuf.FieldMask update_mask = 2;
  // When true, update fails with Aborted unless metadata.version matches.
  bool lock = 3;
}

message ModelsUpdateResponse {
  Model object = 1;
}

message ModelsDeleteRequest {
  string id = 1;
  // Expected version: when set (non-zero), delete fails with Aborted unless
  // it equals the stored metadata.version. Zero skips the check.
  int32 resource_version = 2;
}

message ModelsDeleteResponse {}

// Request of ListLocations (P7). Empty. ListLocations is deprecated: use
// ListPlacementClusters.
message ModelsListLocationsRequest {}

// Response of ListLocations (P7). ListLocations is deprecated: use
// ListPlacementClusters.
message ModelsListLocationsResponse {
  // Despite the name, cluster names, not `location` labels: the same list as
  // ModelsListPlacementClustersResponse.clusters.
  repeated string locations = 1;
}

// Request of ListPlacementClusters. Empty.
message ModelsListPlacementClustersRequest {}

// Response of ListPlacementClusters.
message ModelsListPlacementClustersResponse {
  // Unique sorted ManagedCluster names (metadata.name, which ACM also sets as
  // the cluster's `name` label): the values a placement's `name In [...]`
  // takes.
  repeated string clusters = 1;
}

// Request of ListServingOptions. Empty.
message ModelsListServingOptionsRequest {}

// Response of ListServingOptions: the accelerator configurations a model can
// use. The backend reads them on every call from two ConfigMaps on the hub:
// the defaults the console's Helm chart ships (OpenShift AI's presets) and an
// optional custom one the provider admin owns, whose entries replace or add
// to the defaults by name. The list is the same for every cluster, and the
// backend doesn't read the clusters: OpenShift AI installs on each cluster
// only the accelerator presets its nodes can run, so a model that names a GPU
// preset fails on a cluster without that accelerator, and its status says so.
// Without a configured list it's empty.
message ModelsListServingOptionsResponse {
  // The values a model's spec.base_refs can take: the accelerator
  // configurations.
  repeated BaseRefOption base_refs = 1;
}

// An accelerator configuration, a value of ModelSpec.base_refs: an OpenShift AI
// accelerator preset, an LLMInferenceServiceConfig in the clusters' OpenShift
// AI namespace labelled opendatahub.io/config-type=accelerator.
message BaseRefOption {
  // The preset's full name, release prefix included (such as
  // v3-6-0-kserve-config-llm-template-cpu): the value spec.base_refs takes.
  string name = 1;

  string display_name = 2;

  string description = 3;

  // Extended resources the preset needs on a node, such as nvidia.com/gpu
  // (its opendatahub.io/recommended-accelerators). Empty: it runs on CPUs,
  // and every cluster has it.
  repeated string accelerators = 4;
}

// Models manage LLMInferenceService deployments in the backend's Git catalog,
// placed on clusters by name. Create also writes the ExternalModel and
// MaaSModelRef that register the model on the ingress clusters.
service Models {
  rpc List(ModelsListRequest) returns (ModelsListResponse) {
    option (google.api.http) = {get: "/api/v1/models"};
  }

  rpc Get(ModelsGetRequest) returns (ModelsGetResponse) {
    option (google.api.http) = {
      get: "/api/v1/models/{id}"
      response_body: "object"
    };
  }

  // Creates (= deploys) a model: commits its LLMInferenceService to the
  // placed clusters' indexes, and its ExternalModel and MaaSModelRef to the
  // ingress index, in the Git catalog.
  rpc Create(ModelsCreateRequest) returns (ModelsCreateResponse) {
    option (google.api.http) = {
      post: "/api/v1/models"
      body: "object"
      response_body: "object"
    };
  }

  rpc Update(ModelsUpdateRequest) returns (ModelsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/v1/models/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  rpc Delete(ModelsDeleteRequest) returns (ModelsDeleteResponse) {
    option (google.api.http) = {delete: "/api/v1/models/{id}"};
  }

  // Deprecated: use ListPlacementClusters, which answers the same list as
  // `clusters`. Despite its name, this RPC answers cluster names, not values
  // of the cluster's `location` label (those are in a model's
  // status.placement.locations). It is removed once its clients have moved
  // (docs/API_CONTRACT.md, "Expand, migrate, contract").
  rpc ListLocations(ModelsListLocationsRequest) returns (ModelsListLocationsResponse) {
    option deprecated = true;
    option (google.api.http) = {get: "/api/v1/models:listLocations"};
  }

  // Clusters a model can be placed on: unique sorted names of the
  // ManagedClusters labelled ai-grid/enabled "true" and ai-grid/role
  // inference or combined that are Available and Compliant with the ready
  // Policy (AI_GRID_READY_POLICY). These are the values a placement's
  // `name In [...]` takes.
  rpc ListPlacementClusters(ModelsListPlacementClustersRequest) returns (ModelsListPlacementClustersResponse) {
    option (google.api.http) = {get: "/api/v1/models:listPlacementClusters"};
  }

  // Accelerator configurations a model can use. See
  // ModelsListServingOptionsResponse.
  rpc ListServingOptions(ModelsListServingOptionsRequest) returns (ModelsListServingOptionsResponse) {
    option (google.api.http) = {get: "/api/v1/models:listServingOptions"};
  }
}
