syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/managed_cluster_type.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

message ManagedClustersListRequest {
  // Index of the first result. If not specified the default value will be zero.
  optional int32 offset = 1;

  // Maximum number of results to be returned by the server. When not specified all
  // the results will be returned.
  optional int32 limit = 2;

  // Filter criteria (CEL). Empty means no filter. Not evaluated yet.
  optional string filter = 3;

  // Order criteria. Empty means undefined order. Not evaluated yet.
  optional string order = 4;
}

message ManagedClustersListResponse {
  // Actual number of items returned.
  int32 size = 1;

  // Total number of items that match the search criteria.
  int32 total = 2;

  // List of results.
  repeated ManagedCluster items = 3;
}

message ManagedClustersGetRequest {
  string id = 1;
}

message ManagedClustersGetResponse {
  ManagedCluster object = 1;
}

message ManagedClustersCreateRequest {
  ManagedCluster object = 1;
}

message ManagedClustersCreateResponse {
  ManagedCluster object = 1;
}

message ManagedClustersUpdateRequest {
  ManagedCluster object = 1;
  google.protobuf.FieldMask update_mask = 2;

  // Lock enables optimistic locking against metadata.version. Not enforced yet.
  bool lock = 3;
}

message ManagedClustersUpdateResponse {
  ManagedCluster object = 1;
}

message ManagedClustersDeleteRequest {
  string id = 1;
}

message ManagedClustersDeleteResponse {}

// Hub-side ACM/OCM ManagedCluster CRUD. Does not provision spoke clusters.
service ManagedClusters {
  rpc List(ManagedClustersListRequest) returns (ManagedClustersListResponse) {
    option (google.api.http) = {get: "/api/ai-grid/v1/managed_clusters"};
  }

  rpc Get(ManagedClustersGetRequest) returns (ManagedClustersGetResponse) {
    option (google.api.http) = {
      get: "/api/ai-grid/v1/managed_clusters/{id}"
      response_body: "object"
    };
  }

  rpc Create(ManagedClustersCreateRequest) returns (ManagedClustersCreateResponse) {
    option (google.api.http) = {
      post: "/api/ai-grid/v1/managed_clusters"
      body: "object"
      response_body: "object"
    };
  }

  rpc Update(ManagedClustersUpdateRequest) returns (ManagedClustersUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/ai-grid/v1/managed_clusters/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  rpc Delete(ManagedClustersDeleteRequest) returns (ManagedClustersDeleteResponse) {
    option (google.api.http) = {delete: "/api/ai-grid/v1/managed_clusters/{id}"};
  }
}
