apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-provider-backend-managedclusters
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # OCM admission requires managedclustersets/join to place a ManagedCluster in a
  # ManagedClusterSet (unlabeled CRs join "default"). Without this, Create fails with:
  #   cannot add/remove the resource to/from ManagedClusterSet "default"
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclustersets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclustersets/join"]
    verbs: ["create"]
  # Setting/updating spec.hubAcceptsClient requires the accept subresource.
  - apiGroups: ["register.open-cluster-management.io"]
    resources: ["managedclusters/accept"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-backend-managedclusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-provider-backend-managedclusters
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-backend
    namespace: ai-grid
