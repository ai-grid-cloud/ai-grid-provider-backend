apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Put resources with no namespace in ai-grid. unsetOnly keeps the Roles in
# rbac-namespaced.yaml in the namespaces they name.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: ai-grid-namespace
      namespace: ai-grid
    unsetOnly: true

labels:
  - pairs:
      app.kubernetes.io/name: ai-grid-provider-backend
      app.kubernetes.io/part-of: ai-grid
    includeSelectors: true

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - rbac-namespaced.yaml
  - backend-deployment.yaml
  - backend-service.yaml

images:
  - name: ai-grid-provider-backend
    newName: ghcr.io/ai-grid-cloud/ai-grid-provider-backend
    newTag: latest
